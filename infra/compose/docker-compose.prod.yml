services:
  gateway:
    image: nginx:${NGINX_VERSION}
    container_name: nta-gateway
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT}:80"
    restart: unless-stopped
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    image: nta-platform/frontend:${APP_IMAGE_TAG}
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_SSE_BASE_URL: ${NEXT_PUBLIC_SSE_BASE_URL:-}
        NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-}
        NEXT_PUBLIC_OBJECT_STORE_ROOT_PREFIX: ${NEXT_PUBLIC_OBJECT_STORE_ROOT_PREFIX:-}
    environment:
      NODE_ENV: production
      API_BASE_URL: ${API_BASE_URL}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: nta-platform/api:${APP_IMAGE_TAG}
    build:
      context: ../../backend
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV}
      APP_NAME: ${APP_NAME}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_DIR: ${LOG_DIR}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_BASE_PATH: /api/v1
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      TEMPORAL_HOST: ${TEMPORAL_HOST}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
      TEMPORAL_TASK_QUEUE_EVAL: ${TEMPORAL_TASK_QUEUE_EVAL}
      TEMPORAL_TASK_QUEUE_BATCH: ${TEMPORAL_TASK_QUEUE_BATCH}
      TEMPORAL_TASK_QUEUE_DATASET: ${TEMPORAL_TASK_QUEUE_DATASET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_BROWSER_ENDPOINT_URL: ${S3_BROWSER_ENDPOINT_URL}
      S3_REGION: ${S3_REGION}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_MAIN: ${S3_BUCKET_MAIN}
      S3_ROOT_PREFIX: ${S3_ROOT_PREFIX}
      S3_DIRECT_UPLOAD_MODE: ${S3_DIRECT_UPLOAD_MODE}
      S3_STS_DURATION_SECONDS: ${S3_STS_DURATION_SECONDS}
      S3_CONNECT_TIMEOUT_SECONDS: ${S3_CONNECT_TIMEOUT_SECONDS:-5}
      S3_READ_TIMEOUT_SECONDS: ${S3_READ_TIMEOUT_SECONDS:-60}
      S3_MAX_ATTEMPTS: ${S3_MAX_ATTEMPTS:-2}
      GITEA_INTERNAL_URL: ${GITEA_INTERNAL_URL}
      GITEA_EXTERNAL_URL: ${GITEA_EXTERNAL_URL}
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER}
      GITEA_ADMIN_TOKEN: ${GITEA_ADMIN_TOKEN}
      GITEA_DEFAULT_BRANCH: ${GITEA_DEFAULT_BRANCH}
      GITEA_ORG_PREFIX: ${GITEA_ORG_PREFIX}
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      gitea:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready').read()\" >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    volumes:
      - ../../backend/logs:/app/logs

  worker:
    image: nta-platform/worker:${APP_IMAGE_TAG}
    build:
      context: ../../backend
      dockerfile: Dockerfile.worker
    environment:
      APP_ENV: ${APP_ENV}
      APP_NAME: ${APP_NAME}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_DIR: ${LOG_DIR}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}
      TEMPORAL_HOST: ${TEMPORAL_HOST}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
      TEMPORAL_TASK_QUEUE_EVAL: ${TEMPORAL_TASK_QUEUE_EVAL}
      TEMPORAL_TASK_QUEUE_BATCH: ${TEMPORAL_TASK_QUEUE_BATCH}
      TEMPORAL_TASK_QUEUE_DATASET: ${TEMPORAL_TASK_QUEUE_DATASET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_BROWSER_ENDPOINT_URL: ${S3_BROWSER_ENDPOINT_URL}
      S3_REGION: ${S3_REGION}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_MAIN: ${S3_BUCKET_MAIN}
      S3_ROOT_PREFIX: ${S3_ROOT_PREFIX}
      S3_DIRECT_UPLOAD_MODE: ${S3_DIRECT_UPLOAD_MODE}
      S3_STS_DURATION_SECONDS: ${S3_STS_DURATION_SECONDS}
      S3_CONNECT_TIMEOUT_SECONDS: ${S3_CONNECT_TIMEOUT_SECONDS:-5}
      S3_READ_TIMEOUT_SECONDS: ${S3_READ_TIMEOUT_SECONDS:-60}
      S3_MAX_ATTEMPTS: ${S3_MAX_ATTEMPTS:-2}
      GITEA_INTERNAL_URL: ${GITEA_INTERNAL_URL}
      GITEA_EXTERNAL_URL: ${GITEA_EXTERNAL_URL}
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER}
      GITEA_ADMIN_TOKEN: ${GITEA_ADMIN_TOKEN}
      GITEA_DEFAULT_BRANCH: ${GITEA_DEFAULT_BRANCH}
      GITEA_ORG_PREFIX: ${GITEA_ORG_PREFIX}
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      gitea:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ../../backend/logs:/app/logs

  postgres:
    image: ${POSTGRESQL_IMAGE}
    container_name: nta-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gitea:
    image: gitea/gitea:${GITEA_VERSION}
    container_name: nta-gitea
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__server__DOMAIN: localhost
      GITEA__server__ROOT_URL: ${GITEA_EXTERNAL_URL}/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_PORT: "${GITEA_SSH_PORT}"
      GITEA__server__SSH_LISTEN_PORT: "22"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: ${POSTGRES_USER}
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD}
      GITEA__database__SSL_MODE: disable
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY}
      GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN}
      GITEA__lfs__PATH: /data/git/lfs
      GITEA__lfs__JWT_SECRET: ${GITEA_LFS_JWT_SECRET}
      GITEA__server__LFS_START_SERVER: "true"
      GITEA__server__LFS_JWT_SECRET: ${GITEA_LFS_JWT_SECRET}
    ports:
      - "${GITEA_HTTP_PORT}:3000"
      - "${GITEA_SSH_PORT}:22"
    volumes:
      - gitea_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION}
    container_name: nta-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    volumes:
      - ../temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    restart: unless-stopped

  temporal-admin-tools:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}
    container_name: nta-temporal-admin-tools
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    stdin_open: true
    tty: true

  temporal-namespace-init:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}
    container_name: nta-temporal-namespace-init
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
    volumes:
      - ../scripts/create-temporal-namespace.sh:/scripts/create-temporal-namespace.sh:ro
    entrypoint: ["/bin/sh", "/scripts/create-temporal-namespace.sh"]
    restart: "no"

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    container_name: nta-temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${HTTP_PORT}
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  gitea_data:

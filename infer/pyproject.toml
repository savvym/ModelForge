[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nta-infer-agent"
version = "0.1.2"
description = "Inference node agent for NTA Platform model deployment."
readme = "README.zh-CN.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35.0",
  "fastapi>=0.115.0",
  "huggingface-hub>=0.26.0",
  "httpx>=0.27.2",
  "pydantic-settings>=2.6.0",
  "uvicorn[standard]>=0.32.0",
]

[project.scripts]
nta-infer-agent = "nta_infer_agent.main:main"

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nta_infer_agent"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
